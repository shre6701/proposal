<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Be My Valentine? 💖</title>

    <!-- Romantic elegant fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Romantic baby pink palette */
        --color-bg-1: #fff5f7;
        --color-bg-2: #ffe8f0;
        --color-bg-3: #ffd6e8;
        --color-text: #3d2433;
        --color-muted: #a67c94;
        --color-primary: #ffb3d1;
        --color-primary-soft: #ffd4e5;
        --color-primary-dark: #ff8db8;
        --color-accent: #ffa6c9;
        --color-white: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at top left,
          var(--color-bg-1),
          var(--color-bg-2) 40%,
          var(--color-bg-3) 80%
        );
        animation: bgPulse 20s ease-in-out infinite;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
        padding: 40px 20px;
      }

      @keyframes bgPulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.05); }
      }

      /* Dreamy blobs */
      .bg-blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        z-index: 0;
        pointer-events: none;
      }

      .bg-blob:nth-child(1) {
        width: 350px;
        height: 350px;
        background: linear-gradient(135deg, #ffd4e5, #ffb3d1);
        top: -120px;
        left: -120px;
        animation: float1 28s ease-in-out infinite;
      }

      .bg-blob:nth-child(2) {
        width: 300px;
        height: 300px;
        background: linear-gradient(135deg, #ffa6c9, #ff8db8);
        bottom: -100px;
        right: -150px;
        animation: float2 32s ease-in-out infinite;
      }

      .bg-blob:nth-child(3) {
        width: 260px;
        height: 260px;
        background: linear-gradient(135deg, #fff5f7, #ffd4e5);
        top: 45%;
        right: 8%;
        animation: float3 36s ease-in-out infinite;
      }

      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(60px, -50px) rotate(120deg); }
        66% { transform: translate(-40px, 40px) rotate(240deg); }
      }

      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(-50px, 60px) rotate(120deg); }
        66% { transform: translate(40px, -40px) rotate(240deg); }
      }

      @keyframes float3 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(40px, 50px) rotate(180deg); }
      }

      /* Romantic floating hearts */
      .floating-hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .floating-heart {
        position: absolute;
        font-size: 24px;
        opacity: 0;
        animation: heartFloat 12s ease-in infinite;
      }

      @keyframes heartFloat {
        0% {
          opacity: 0;
          transform: translateY(100vh) scale(0.3) rotate(0deg);
        }
        10% { opacity: 0.9; }
        90% { opacity: 0.3; }
        100% {
          opacity: 0;
          transform: translateY(-180px) scale(1.1) rotate(360deg);
        }
      }

      .container {
        position: relative;
        z-index: 5;
        width: 100%;
        max-width: 620px;
        margin: auto;
      }

      .card {
        background: rgba(255, 255, 255, 0.88);
        border-radius: 36px;
        box-shadow: 
          0 35px 90px rgba(255, 141, 184, 0.28),
          0 0 0 1px rgba(255, 179, 209, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(40px) saturate(180%);
        padding: 65px 55px 55px;
        position: relative;
        overflow: hidden;
        animation: cardEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes cardEntrance {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Soft romantic glow */
      .card::before {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 179, 209, 0.25), transparent 70%);
        top: -60px;
        right: -60px;
        animation: glowPulse 4s ease-in-out infinite;
      }

      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      /* ROMANTIC ENVELOPE */

      .envelope-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
        position: relative;
        perspective: 1400px;
      }

      .envelope-container {
        position: relative;
        width: 340px;
        height: 240px;
        cursor: pointer;
        transition: transform 0.4s ease;
      }

      .envelope-container:hover:not(.opening) {
        transform: translateY(-12px) scale(1.03);
      }

      /* Envelope body - the base */
      .envelope-body {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fff0f5 0%, #ffe8f0 50%, #ffd4e5 100%);
        border-radius: 12px;
        box-shadow: 
          0 25px 60px rgba(255, 141, 184, 0.35),
          inset 0 -2px 0 rgba(255, 255, 255, 0.8),
          inset 0 2px 8px rgba(255, 141, 184, 0.15);
        z-index: 1;
      }

      /* Envelope flap - the opening part */
      .envelope-flap {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        transform-origin: top center;
        transition: transform 1.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        z-index: 3;
      }

      /* Flap front - what you see closed */
      .flap-front {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #ffb3d1 0%, #ffd4e5 50%, #ffe8f0 100%);
        border-radius: 12px;
        clip-path: polygon(0 0, 100% 0, 50% 60%);
        box-shadow: 
          0 15px 45px rgba(255, 141, 184, 0.4),
          inset 0 -2px 8px rgba(255, 255, 255, 0.6);
        backface-visibility: hidden;
      }

      /* Decorative fold lines */
      .flap-front::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 1px;
        height: 60%;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), transparent);
        transform: translateX(-50%);
      }

      /* Flap back - inside of the flap */
      .flap-back {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fff5f7 0%, #ffe8f0 100%);
        clip-path: polygon(0 0, 100% 0, 50% 60%);
        transform: rotateY(180deg);
        backface-visibility: hidden;
      }

      /* Opening animation */
      .envelope-container.opening .envelope-flap {
        transform: rotateX(-180deg);
      }

      /* Letter inside */
      .letter {
        position: absolute;
        width: 85%;
        height: 75%;
        left: 7.5%;
        top: 15%;
        background: linear-gradient(135deg, #ffffff 0%, #fff9fc 100%);
        border-radius: 8px;
        box-shadow: 
          0 8px 30px rgba(255, 141, 184, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 1);
        z-index: 2;
        transition: all 1.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        transform: translateY(0);
        opacity: 1;
      }

      .envelope-container.opening .letter {
        transform: translateY(-60px);
        opacity: 0;
      }

      /* Heart seal */
      .heart-seal {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #ff8db8, #ffb3d1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        box-shadow: 
          0 12px 35px rgba(255, 141, 184, 0.5),
          0 0 0 4px rgba(255, 255, 255, 0.9),
          inset 0 2px 10px rgba(255, 255, 255, 0.5);
        z-index: 4;
        animation: sealBeat 2.8s ease-in-out infinite;
        transition: all 0.8s ease;
      }

      @keyframes sealBeat {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
          box-shadow: 
            0 12px 35px rgba(255, 141, 184, 0.5),
            0 0 0 4px rgba(255, 255, 255, 0.9),
            0 0 20px rgba(255, 179, 209, 0);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.08);
          box-shadow: 
            0 15px 40px rgba(255, 141, 184, 0.6),
            0 0 0 4px rgba(255, 255, 255, 0.9),
            0 0 30px rgba(255, 179, 209, 0.6);
        }
      }

      .envelope-container.opening .heart-seal {
        transform: translate(-50%, -50%) scale(0) rotate(180deg);
        opacity: 0;
      }

      /* Sparkles around envelope */
      .envelope-sparkles {
        position: absolute;
        inset: -50px;
        pointer-events: none;
        z-index: 5;
      }

      .sparkle {
        position: absolute;
        font-size: 22px;
        animation: sparkleFloat 3s ease-in-out infinite;
      }

      .sparkle:nth-child(1) { left: 8%; top: 18%; animation-delay: 0s; }
      .sparkle:nth-child(2) { right: 8%; top: 22%; animation-delay: 0.6s; }
      .sparkle:nth-child(3) { left: 5%; bottom: 28%; animation-delay: 1.2s; }
      .sparkle:nth-child(4) { right: 5%; bottom: 25%; animation-delay: 1.8s; }
      .sparkle:nth-child(5) { left: 50%; top: 8%; animation-delay: 0.4s; }
      .sparkle:nth-child(6) { left: 50%; bottom: 8%; animation-delay: 1.4s; }

      @keyframes sparkleFloat {
        0%, 100% {
          opacity: 0;
          transform: scale(0.6) rotate(0deg) translateY(0);
        }
        50% {
          opacity: 1;
          transform: scale(1.3) rotate(180deg) translateY(-8px);
        }
      }

      /* Hearts burst when opening */
      .hearts-burst {
        position: absolute;
        inset: -60px;
        pointer-events: none;
        z-index: 6;
      }

      .burst-heart {
        position: absolute;
        font-size: 20px;
        opacity: 0;
        left: 50%;
        top: 50%;
      }

      .envelope-container.opening .burst-heart {
        animation: heartBurst 1.5s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
      }

      @keyframes heartBurst {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.5);
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(360deg);
        }
      }

      .envelope-hint {
        margin-top: 38px;
        font-size: 18px;
        color: var(--color-muted);
        text-align: center;
        font-weight: 500;
        letter-spacing: 0.3px;
        animation: hintPulse 3s ease-in-out infinite;
      }

      @keyframes hintPulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      /* CONTENT STATES */

      .question-state,
      .success-container {
        transition: opacity 0.6s ease, transform 0.6s ease;
      }

      .hidden {
        display: none !important;
      }

      .fade-out {
        opacity: 0;
        transform: translateY(-25px);
      }

      #proposalContent,
      #successContent {
        text-align: center;
      }

      .emoji-container {
        margin-bottom: 38px;
        animation: emojiFloat 3.5s ease-in-out infinite;
      }

      @keyframes emojiFloat {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-18px) rotate(3deg); }
      }

      .emoji {
        font-size: 85px;
        display: inline-block;
        filter: drop-shadow(0 12px 30px rgba(255, 141, 184, 0.35));
        position: relative;
      }

      .emoji::after {
        content: "✨";
        position: absolute;
        top: -15px;
        right: -25px;
        font-size: 38px;
        animation: emojiSparkle 3s ease-in-out infinite;
      }

      @keyframes emojiSparkle {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        50% {
          transform: scale(1.6) rotate(180deg);
          opacity: 0.7;
        }
      }

      h1 {
        font-size: 42px;
        color: var(--color-text);
        margin-bottom: 18px;
        font-weight: 600;
        line-height: 1.3;
        font-family: "Playfair Display", serif;
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-size: 19px;
        color: var(--color-muted);
        margin-bottom: 38px;
        font-weight: 400;
        letter-spacing: 0.2px;
        line-height: 1.6;
      }

      .name-highlight {
        background: linear-gradient(120deg, #ff8db8, #ffb3d1, #ffa6c9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        animation: nameShimmer 3s ease-in-out infinite;
        background-size: 200% auto;
      }

      @keyframes nameShimmer {
        0%, 100% { background-position: 0% center; }
        50% { background-position: 100% center; }
      }

      .button-container {
        display: flex;
        gap: 22px;
        justify-content: center;
        align-items: center;
        margin-top: 32px;
        position: relative;
        min-height: 115px;
      }

      .btn {
        padding: 20px 48px;
        font-size: 20px;
        font-weight: 600;
        border: none;
        border-radius: 60px;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 12px 35px rgba(255, 141, 184, 0.3);
        position: relative;
        white-space: nowrap;
        letter-spacing: 0.3px;
      }

      .btn-yes {
        background: linear-gradient(135deg, #ff8db8, #ffb3d1, #ffa6c9);
        background-size: 200% auto;
        color: white;
        border: 3px solid rgba(255, 255, 255, 0.95);
        animation: yesGradient 4s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes yesGradient {
        0%, 100% {
          background-position: 0% center;
          transform: scale(1);
          box-shadow: 
            0 12px 35px rgba(255, 141, 184, 0.4),
            0 0 25px rgba(255, 179, 209, 0);
        }
        50% {
          background-position: 100% center;
          transform: scale(1.06);
          box-shadow: 
            0 18px 45px rgba(255, 141, 184, 0.6),
            0 0 35px rgba(255, 179, 209, 0.5);
        }
      }

      .btn-yes:hover {
        transform: scale(1.1) translateY(-3px);
        box-shadow: 
          0 22px 55px rgba(255, 141, 184, 0.65),
          0 0 40px rgba(255, 179, 209, 0.6);
      }

      .btn-yes:active {
        transform: scale(0.98);
      }

      .btn-no {
        background: white;
        color: var(--color-muted);
        border: 3px solid var(--color-primary-soft);
        z-index: 2;
      }

      .btn-no:hover {
        background: var(--color-primary-soft);
        color: var(--color-text);
        border-color: var(--color-primary);
      }

      .btn-no.moving {
        position: absolute;
        z-index: 3;
      }

      .attempts-text {
        font-size: 17px;
        color: var(--color-muted);
        margin-top: 28px;
        font-weight: 500;
        min-height: 26px;
        letter-spacing: 0.2px;
        line-height: 1.5;
      }

      .success-container {
        animation: successReveal 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes successReveal {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .success-message {
        font-size: 36px;
        background: linear-gradient(135deg, #ff8db8, #ffb3d1, #ffa6c9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
        margin-top: 22px;
        font-family: "Playfair Display", serif;
        animation: successPulse 3s ease-in-out infinite;
        background-size: 200% auto;
      }

      @keyframes successPulse {
        0%, 100% {
          transform: scale(1);
          background-position: 0% center;
        }
        50% {
          transform: scale(1.06);
          background-position: 100% center;
        }
      }

      .love-note {
        font-size: 20px;
        color: var(--color-text);
        margin-top: 30px;
        line-height: 1.9;
        letter-spacing: 0.2px;
        font-weight: 400;
      }

      .yes-extra-line {
        margin-top: 32px;
        font-size: 18px;
        color: var(--color-muted);
        font-weight: 500;
        font-style: italic;
      }

      .photo-reveal {
        margin-top: 45px;
      }

      .photo-reveal.show {
        display: block;
        animation: photosShow 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes photosShow {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.88);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .photo-card {
        width: 100%;
        max-width: 500px;
        margin: 35px auto;
        border-radius: 28px;
        box-shadow: 
          0 35px 80px rgba(255, 141, 184, 0.38),
          0 0 0 1px rgba(255, 255, 255, 0.9),
          0 0 0 5px var(--color-primary-soft);
        background: white;
        position: relative;
        overflow: hidden;
        animation: photoReveal 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      @keyframes photoReveal {
        from {
          opacity: 0;
          transform: scale(0.5) rotate(-12deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      .photo-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 0%, rgba(255, 179, 209, 0.35) 50%, transparent 100%);
        transform: translateX(-150%);
        animation: photoShimmer 4.5s ease-in-out infinite;
      }

      @keyframes photoShimmer {
        0%, 100% { transform: translateX(-150%); }
        50% { transform: translateX(150%); }
      }

      .photo-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        aspect-ratio: 4 / 3;
      }

      .photo-caption {
        text-align: center;
        font-size: 18px;
        color: var(--color-muted);
        margin-top: 18px;
        font-weight: 500;
        letter-spacing: 0.2px;
        font-style: italic;
      }

      .final-confetti {
        position: fixed;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        animation: confettiDrop 4.5s ease-out forwards;
      }

      @keyframes confettiDrop {
        to {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }

      @media (max-width: 600px) {
        body { padding: 30px 18px; }
        .card { padding: 50px 35px 45px; border-radius: 32px; }
        h1 { font-size: 34px; }
        .subtitle { font-size: 17px; }
        .emoji { font-size: 72px; }
        .emoji::after { font-size: 32px; }
        .btn { padding: 18px 40px; font-size: 18px; }
        .envelope-container { width: 300px; height: 210px; }
        .heart-seal { width: 60px; height: 60px; font-size: 30px; }
        .success-message { font-size: 30px; }
        .love-note { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>

    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container">
      <div class="card">
        <!-- ROMANTIC ENVELOPE -->
        <div id="envelopeWrapper" class="envelope-wrapper">
          <div class="envelope-container" id="envelopeContainer">
            <!-- Envelope body -->
            <div class="envelope-body"></div>
            
            <!-- Letter inside -->
            <div class="letter"></div>
            
            <!-- Envelope flap -->
            <div class="envelope-flap">
              <div class="flap-front"></div>
              <div class="flap-back"></div>
            </div>
            
            <!-- Heart seal -->
            <div class="heart-seal">💕</div>
            
            <!-- Sparkles -->
            <div class="envelope-sparkles">
              <div class="sparkle">✨</div>
              <div class="sparkle">💫</div>
              <div class="sparkle">⭐</div>
              <div class="sparkle">✨</div>
              <div class="sparkle">💫</div>
              <div class="sparkle">⭐</div>
            </div>
            
            <!-- Hearts burst -->
            <div class="hearts-burst" id="heartsBurst"></div>
          </div>
        </div>
        <p class="envelope-hint" id="envelopeHint">
          Click the envelope to open your letter 💌
        </p>

        <!-- QUESTION STATE -->
        <div id="proposalContent" class="question-state hidden fade-out">
          <div class="emoji-container">
            <div class="emoji">🧸</div>
          </div>
          <h1>
            Hewwooo <span class="name-highlight">Mimi</span>,<br />will you be my <span class="name-highlight">Valentine</span>💕
          </h1>
          <p class="subtitle">
            We have already planned it all btw!😂
          </p>

          <div class="button-container" id="buttonContainer">
            <button class="btn btn-yes" id="yesBtn" onclick="handleYes()">
              Yes! 💖
            </button>
            <button class="btn btn-no" id="noBtn">Not sure</button>
          </div>
          <p class="attempts-text" id="attemptsText"></p>
        </div>

        <!-- SUCCESS STATE -->
        <div id="successContent" class="success-container hidden">
          <div class="emoji-container">
            <div class="emoji">🧸</div>
          </div>
          <div class="success-message">You just made me the happiest! 🎉</div>
          <div class="love-note">
            <span class="name-highlight">I cant wait see youuuu!! </span>💖  
          </div>
          <div class="photo-reveal" id="photoReveal"></div>
        </div>
      </div>
    </div>

    <script>
      let attempts = 0;
      let yesBtnScale = 1;
      const noBtn = document.getElementById("noBtn");
      const yesBtn = document.getElementById("yesBtn");
      const attemptsText = document.getElementById("attemptsText");
      const buttonContainer = document.getElementById("buttonContainer");

      const envelopeContainer = document.getElementById("envelopeContainer");
      const envelopeWrapper = document.getElementById("envelopeWrapper");
      const envelopeHint = document.getElementById("envelopeHint");
      const proposalContent = document.getElementById("proposalContent");
      const successContent = document.getElementById("successContent");

      // Romantic floating hearts
      function createFloatingHearts() {
        const container = document.getElementById("floatingHearts");
        const hearts = ["💖", "💕", "💗", "💝", "🩷", "💘", "✨"];
        setInterval(() => {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.left = Math.random() * 100 + "%";
          heart.style.animationDelay = Math.random() * 4 + "s";
          heart.style.animationDuration = Math.random() * 6 + 10 + "s";
          container.appendChild(heart);
          setTimeout(() => heart.remove(), 12000);
        }, 1200);
      }
      createFloatingHearts();

      // Create hearts burst
      function createHeartsBurst() {
        const container = document.getElementById("heartsBurst");
        const hearts = ["💖", "💕", "💗", "💝", "🩷", "💘"];
        
        for (let i = 0; i < 24; i++) {
          const heart = document.createElement("div");
          heart.className = "burst-heart";
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          
          const angle = (Math.PI * 2 * i) / 24;
          const distance = 160 + Math.random() * 80;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          
          heart.style.setProperty("--tx", `${tx}px`);
          heart.style.setProperty("--ty", `${ty}px`);
          heart.style.animationDelay = `${Math.random() * 0.3}s`;
          
          container.appendChild(heart);
        }
      }
      createHeartsBurst();

      // Envelope opening
      envelopeContainer.addEventListener("click", () => {
        envelopeContainer.classList.add("opening");
        
        setTimeout(() => {
          envelopeWrapper.classList.add("fade-out");
          envelopeHint.classList.add("fade-out");
          
          setTimeout(() => {
            envelopeWrapper.classList.add("hidden");
            envelopeHint.classList.add("hidden");
            proposalContent.classList.remove("hidden", "fade-out");
          }, 600);
        }, 1400);
      });

      // Runaway No button
      function runAwayFromNo(e) {
        noBtn.classList.add("moving");
        attempts++;
        yesBtnScale += 0.12;

        const containerRect = buttonContainer.getBoundingClientRect();
        const noRect = noBtn.getBoundingClientRect();
        const padding = 10;
        const maxX = containerRect.width - noRect.width - padding;
        const maxY = containerRect.height - noRect.height - padding;

        const randomX = Math.random() * maxX - maxX / 2;
        const randomY = Math.random() * maxY - maxY / 2;

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
        yesBtn.style.transform = `scale(${yesBtnScale})`;

        const messages = [
          "Playing hard to get? I adore it! 😏💕",
          "Come on, we both know you want to say yes. 😉",
          "Stop teasing and just say yes already! 💖",
          "You're making me work for it... worth every second. 🔥",
          "I can see that beautiful smile. 😊💕",
          "Resistance is useless, my darling. 😘",
          "This chase is absolutely enchanting. 💘",
          "Every hesitation makes your yes more precious. 💖",
          "I'll wait forever if that's what it takes. 💕",
          "Fine, I'll just keep falling deeper for you. 🥰",
        ];

        attemptsText.textContent = messages[Math.min(attempts - 1, messages.length - 1)];
      }

      noBtn.addEventListener("mouseenter", runAwayFromNo);
      noBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        runAwayFromNo(e);
      });
      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        runAwayFromNo(e);
      });

      // Handle Yes
      function handleYes() {
        proposalContent.classList.add("hidden");
        successContent.classList.remove("hidden");
        successContent.style.display = "block";

        const photoReveal = document.getElementById("photoReveal");
        photoReveal.classList.add("show");

        // Romantic photo
        const romanticCard = document.createElement("div");
        romanticCard.className = "photo-card";
        romanticCard.style.animationDelay = "0.5s";
        const romanticImg = document.createElement("img");
        romanticImg.src = "./sending_virtual_flowers.jfif";
        romanticImg.alt = "Us together";
        romanticCard.appendChild(romanticImg);
        photoReveal.appendChild(romanticCard);

        const romanticCaption = document.createElement("div");
        romanticCaption.className = "photo-caption";
        // romanticCaption.textContent = "Forever and always, just us 💕✨";
        photoReveal.appendChild(romanticCaption);

        // Cat with flowers
        const catCard = document.createElement("div");
        catCard.className = "photo-card";
        catCard.style.animationDelay = "0.2s";
        const catImg = document.createElement("img");
        catImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcGdkNHhjMW42NGVqNHphbzZ5eWYwcDFrN2g0bTcxYmxtamZjc2M1diZlcD12MV9naWZzX3NlYXJjaCZjdD1n/W1hd3uXRIbddu/giphy.gif";
        catImg.alt = "Cat with flowers";
        catCard.appendChild(catImg);
        photoReveal.appendChild(catCard);

        const catCaption = document.createElement("div");
        catCaption.className = "photo-caption";
        catCaption.textContent = "Even the cat approves of us 🐾💐";
        photoReveal.appendChild(catCaption);



        createFinalConfetti();
        document.body.style.background = "linear-gradient(135deg, #ffd4e5 0%, #ffb3d1 50%, #ff8db8 100%)";
      }

      function createFinalConfetti() {
        const colors = ["#ffb3d1", "#ffd4e5", "#ff8db8", "#ffa6c9", "#ffffff", "#fff5f7"];
        for (let i = 0; i < 180; i++) {
          setTimeout(() => {
            const confetti = document.createElement("div");
            confetti.className = "final-confetti";
            confetti.style.left = Math.random() * 100 + "%";
            confetti.style.top = "-25px";
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 0.6 + "s";
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4500);
          }, i * 18);
        }
      }
    </script>
  </body>
</html>
